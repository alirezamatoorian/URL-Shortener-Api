
services:
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:16
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD","pg_isready","-U","$DB_USER","-d","$DB_NAME"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
volumes:
  pgdata:
