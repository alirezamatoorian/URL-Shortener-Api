services:
  web:
    env_file:
      - .env.prod
    volumes:
      - static:/app/static_files
      - media:/app/media
    command: ["gunicorn","core.wsgi:application","--bind","0.0.0.0:8000"]
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static:/app/static_files
      - media:/app/media
    ports:
      - 80:80
    depends_on:
      - web
volumes:
  static:
  media: